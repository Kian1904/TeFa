<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi TeFa — Siswa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/app.css">
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand"><span class="logo">T</span><span class="brandtxt">Absensi TeFa<small>SMK Yappa Depok &middot; Teaching Factory</small></span></div>
      <nav class="topnav"><a href="./index.html">Beranda</a></nav>
    </div>
  </div>

  <div class="container narrow">
    <div class="card white" id="scanCard">
      <div class="eyebrow">Halaman siswa</div>
      <h2>Scan barcode guru PJ</h2>
      <p class="hint">Arahkan kamera HP ke barcode yang ditampilkan guru PJ kamu. Halaman ini terbuka otomatis setelah scan.</p>
    </div>

    <div class="card white hidden" id="formCard">
      <div class="kv"><span class="k">Unit</span><span class="v" id="vUnit">-</span></div>
      <div class="kv"><span class="k">Sesi</span><span class="v" id="vSesi">-</span></div>

      <div id="rosterBox" class="hidden">
        <label>Pilih namamu</label>
        <div id="rosterList" class="toolbar" style="margin-bottom:8px;"></div>
        <button id="btnManual" class="btn btn-sm" type="button">Namaku tidak ada di daftar</button>
      </div>

      <div id="manualBox" class="hidden">
        <label for="nama">Nama kamu</label>
        <input id="nama" placeholder="Tulis nama lengkap" autocomplete="off">
        <label for="kelas">Kelas</label>
        <select id="kelas"></select>
      </div>

      <label>Lokasi</label>
      <button id="btnLokasi" class="btn btn-block" type="button">Ambil lokasi presisi</button>
      <div id="lokasi" class="summary hidden" style="margin-top:8px;"></div>

      <button id="btnCheckin" class="btn btn-primary btn-block" type="button" style="margin-top:14px;" disabled>Check-in TeFa</button>
    </div>

    <div id="status" class="status hidden"></div>
  </div>

  <script type="module">
    import { api } from './assets/js/api.js';
    import { $, say } from './assets/js/common.js';

    const state = { tiket: null, lokasi: null };
    const status = $('status');

    // ID device stabil di HP ini (localStorage) buat aturan "1 HP = 1 check-in".
    function deviceId() {
      let d = '';
      try { d = localStorage.getItem('tefa_device') || ''; } catch (e) {}
      if (!d) {
        d = 'd-' + ((window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now() + '-' + Math.random().toString(36).slice(2)));
        try { localStorage.setItem('tefa_device', d); } catch (e) {}
      }
      return d;
    }

    function mulai(kode) {
      if (!kode) { say(status, 'Belum ada barcode terbaca. Scan barcode dari layar guru PJ.', 'info'); return; }
      say(status, 'Memeriksa barcode...', 'info');
      api('tefaTukarTiket', kode).then(function (res) {
        if (!res || !res.ok) { say(status, (res && res.message) || 'Barcode tidak valid.', 'err'); return; }
        state.tiket = res.tiket;
        $('vUnit').textContent = res.unitNama || res.unit;
        $('vSesi').textContent = 'Sesi ' + res.sesi + ' (jam ' + res.jamKe + ')';
        const sel = $('kelas');
        sel.innerHTML = '';
        const o0 = document.createElement('option'); o0.value = ''; o0.textContent = '-- pilih kelas --';
        sel.appendChild(o0);
        (res.kelasList || []).forEach(function (k) {
          const o = document.createElement('option'); o.value = k; o.textContent = k; sel.appendChild(o);
        });

        // Pilih dari roster sesi ini (kalau ada); kalau kosong → input manual.
        const roster = res.roster || [];
        const rbox = $('rosterList');
        rbox.innerHTML = '';
        if (roster.length) {
          roster.forEach(function (it) {
            const b = document.createElement('button');
            b.type = 'button'; b.className = 'chip';
            b.textContent = it.nama + (it.kelas ? ' \u00b7 ' + it.kelas : '');
            b.addEventListener('click', function () {
              Array.prototype.forEach.call(rbox.children, function (c) { c.classList.remove('active'); });
              b.classList.add('active');
              $('nama').value = it.nama;
              $('kelas').value = it.kelas;
            });
            rbox.appendChild(b);
          });
          $('rosterBox').classList.remove('hidden');
          $('manualBox').classList.add('hidden');
        } else {
          $('rosterBox').classList.add('hidden');
          $('manualBox').classList.remove('hidden');
        }

        $('formCard').classList.remove('hidden');
        $('scanCard').classList.add('hidden');
        say(status, 'Isi nama + kelas, ambil lokasi, lalu check-in.', 'ok');
      }).catch(function (e) { say(status, 'Gagal: ' + e.message, 'err'); });
    }

    const params = new URLSearchParams(location.search);
    mulai(params.get('qr'));

    $('btnManual').addEventListener('click', function () {
      $('manualBox').classList.remove('hidden');
      $('nama').value = ''; $('kelas').value = '';
      Array.prototype.forEach.call($('rosterList').children, function (c) { c.classList.remove('active'); });
    });

    $('btnLokasi').addEventListener('click', function () {
      if (!navigator.geolocation) { say(status, 'Browser tidak mendukung GPS.', 'err'); return; }
      say(status, 'Mengambil lokasi presisi...', 'info');
      $('btnLokasi').disabled = true;
      navigator.geolocation.getCurrentPosition(function (pos) {
        $('btnLokasi').disabled = false;
        state.lokasi = { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy };
        $('lokasi').textContent = 'Lat ' + state.lokasi.lat.toFixed(6) + ' \u00b7 Lng ' + state.lokasi.lng.toFixed(6) +
          ' \u00b7 Akurasi \u00b1' + Math.round(state.lokasi.accuracy) + 'm';
        $('lokasi').classList.remove('hidden');
        $('btnCheckin').disabled = false;
        say(status, 'Lokasi terkunci. Tekan Check-in TeFa.', 'ok');
      }, function (err) {
        $('btnLokasi').disabled = false;
        say(status, 'Gagal ambil lokasi: ' + err.message, 'err');
      }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
    });

    $('btnCheckin').addEventListener('click', function () {
      if (!state.tiket) { say(status, 'Barcode belum terbaca. Scan ulang.', 'err'); return; }
      if (!$('nama').value.trim()) { say(status, 'Isi nama dulu.', 'err'); return; }
      if (!$('kelas').value) { say(status, 'Pilih kelas dulu.', 'err'); return; }
      if (!state.lokasi) { say(status, 'Ambil lokasi dulu.', 'err'); return; }
      const reqId = (crypto && crypto.randomUUID) ? crypto.randomUUID() : ('req-' + Date.now());
      const payload = {
        tiket: state.tiket, nama: $('nama').value.trim(), kelas: $('kelas').value,
        lat: state.lokasi.lat, lng: state.lokasi.lng, accuracy: state.lokasi.accuracy, reqId: reqId,
        device: deviceId()
      };
      $('btnCheckin').disabled = true;
      say(status, 'Mengirim check-in...', 'info');
      api('tefaCheckIn', payload).then(function (res) {
        if (res && res.ok) {
          say(status, res.message + (res.sesuaiRoster === 'N' ? ' (catatan: di luar roster sesi ini)' : ''), 'ok');
        } else {
          $('btnCheckin').disabled = false;
          say(status, (res && res.message) || 'Gagal check-in.', 'err');
        }
      }).catch(function (e) {
        $('btnCheckin').disabled = false;
        say(status, 'Gagal: ' + e.message, 'err');
      });
    });
  </script>
</body>
</html>
